version: 1
backend:
  phases:
    build:
      commands:
        - '# Set environment variable to bypass app ID mismatch check'
        - export AMPLIFY_SKIP_APP_ID_MISMATCH_CHECK=true
        - '# Execute Amplify CLI commands'
        - amplifyPush --simple
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
